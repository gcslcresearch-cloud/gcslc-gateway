<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SMM | Sovereign Materiality Mirror</title>
    <style>
        :root {
            --neon-gold: #c5a059;
            --deep-black: #050505;
            --terminal-green: #00ff41;
        }

        body {
            background-color: var(--deep-black);
            color: var(--neon-gold);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            margin: 0;
            transition: filter 0.3s ease;
        }

        /* Sovereign Shield: Visual protection */
        @media print { body { display: none; } }

        /* Watermark Vitality: 50% Size + Breathing Pulse */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            max-width: 50vw;
            opacity: 0.6;
            z-index: -1;
            pointer-events: none;
            animation: breathing 4s ease-in-out infinite;
        }

        @keyframes breathing {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(-45deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(-45deg); }
        }

        /* Bento Intelligence Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 40px;
            min-height: 60vh;
        }

        @media (max-width: 640px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 20px;
            }
        }

        .determinant-card,
        .determinant-box {
            border: 1px solid var(--neon-gold);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(197, 160, 89, 0.05);
        }

        .determinant-card:hover,
        .determinant-box:hover {
            background: var(--neon-gold);
            color: var(--deep-black);
            box-shadow: 0 0 20px var(--neon-gold);
        }

        /* Chronos Sync Display */
        .chronos-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #333;
            font-size: 0.8rem;
        }

        #insight-display,
        #insight-terminal {
            min-height: 100px;
            padding: 20px;
            margin: 0 40px;
            border-left: 3px solid var(--terminal-green);
            background: rgba(0, 255, 65, 0.02);
            font-size: 1.1rem;
        }

        @media (max-width: 640px) {
            #insight-display, #insight-terminal { margin: 0 20px; font-size: 0.95rem; }
        }

        /* Sovereign Insight Modal — typewriter runs inside here */
        .insight-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.92);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .insight-modal-overlay.open {
            display: flex;
        }
        .insight-modal {
            max-width: 520px;
            width: 100%;
            border: 2px solid var(--neon-gold);
            background: var(--deep-black);
            padding: 24px;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.3);
        }
        .insight-modal h2 {
            margin: 0 0 16px 0;
            font-size: 1rem;
            color: var(--terminal-green);
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .insight-modal .modal-body {
            min-height: 4em;
            padding: 12px 0;
            border-left: 3px solid var(--terminal-green);
            padding-left: 12px;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--neon-gold);
        }
        .insight-modal .modal-close {
            margin-top: 16px;
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--neon-gold);
            color: var(--neon-gold);
            font-family: inherit;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .insight-modal .modal-close:hover {
            background: var(--neon-gold);
            color: var(--deep-black);
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <img src="gcslc_logo.png" class="watermark" alt="GCSLC SECURED" onerror="this.style.display='none'">

    <div class="bento-grid" id="grid"></div>

    <div id="insight-display">
        &gt; SYSTEM READY: Awaiting Sovereign Query...
    </div>

    <div class="chronos-bar" id="clocks"></div>

    <!-- Modal: Sovereign Insight typewriter runs inside this -->
    <div class="insight-modal-overlay" id="insightModal" aria-hidden="true">
        <div class="insight-modal">
            <h2 id="modal-title">Sovereign Insight</h2>
            <div class="modal-body" id="modal-insight-text">&gt; </div>
            <button type="button" class="modal-close" id="modalClose">Close</button>
        </div>
    </div>

    <script>
        /* --- GCSLC SOVEREIGN MAPPING: DO NOT SIMPLIFY --- */
        const DETERMINANTS = {
            D1: "REFINE: Distilling national assets into high-yield liquidity.",
            D2: "RESET: Calibrating the 8090 NRRFC for global alignment.",
            D3: "RESEARCH: Proprietary intelligence under NCC LW15954.",
            D4: "RESTRUCTURE: Engineering fiscal pathways for MGX/Mubadala.",
            D5: "RESUSCITATE: Revitalizing moribund sovereign entities.",
            D6: "REVITALIZE: Boosting the NGECC green energy chemical core.",
            D7: "RE-ENGINEER: Rebuilding the 8R Stealth Paradigm OS.",
            D8: "RETAIN: Anchoring material authority in the GCSLC Mirror."
        };

        let typewriterInterval = null;

        /* --- CHAIRMAN'S FINAL BRIDGE: MODAL INJECTION --- */
        function runTypewriter(id) {
            const text = DETERMINANTS[id];
            const modal = document.getElementById('insightModal');
            const modalTitle = document.getElementById('modal-title');

            if (typewriterInterval) clearInterval(typewriterInterval);

            /* Open modal and set title */
            if (modal) {
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
            }
            if (modalTitle) modalTitle.textContent = id + " — Sovereign Insight";

            // 1. Target the element INSIDE the pop-up modal
            const modalDisplay = document.querySelector('.modal-body') || document.getElementById('insight-display');

            if (modalDisplay) {
                modalDisplay.innerHTML = "&gt; ";
                let i = 0;
                typewriterInterval = setInterval(() => {
                    modalDisplay.innerHTML += text.charAt(i);
                    i++;
                    if (i >= text.length) {
                        clearInterval(typewriterInterval);
                        typewriterInterval = null;
                    }
                }, 30);
            }
        }

        function closeModal() {
            const modal = document.getElementById('insightModal');
            if (typewriterInterval) {
                clearInterval(typewriterInterval);
                typewriterInterval = null;
            }
            if (modal) {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            }
        }

        document.getElementById('modalClose').onclick = closeModal;
        document.getElementById('insightModal').onclick = function(e) {
            if (e.target === this) closeModal();
        };

        const grid = document.getElementById('grid');
        for (let i = 1; i <= 8; i++) {
            const card = document.createElement('div');
            card.className = 'determinant-card';
            card.innerHTML = `[D${i}] DETERMINANT`;
            grid.appendChild(card);
        }

        /* Ensure each box in the Bento Grid calls its specific ID */
        document.querySelectorAll('.determinant-card').forEach((card, index) => {
            const id = `D${index + 1}`;
            card.onclick = () => runTypewriter(id);
        });

        // Chronos Sync: Real-time clock synchronization
        function updateClocks() {
            const zones = [
                { city: 'NEW YORK', tz: 'America/New_York' },
                { city: 'LONDON', tz: 'Europe/London' },
                { city: 'GENEVA', tz: 'Europe/Zurich' },
                { city: 'DUBAI', tz: 'Asia/Dubai' },
                { city: 'HONG KONG', tz: 'Asia/Hong_Kong' },
                { city: 'ZARIA/ABUJA', tz: 'Africa/Lagos' }
            ];

            const html = zones.map(z => {
                const time = new Intl.DateTimeFormat('en-GB', {
                    timeZone: z.tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(new Date());
                return `<div>${z.city}: <span style="color:#fff">${time}</span></div>`;
            }).join('');

            document.getElementById('clocks').innerHTML = html;
        }

        setInterval(updateClocks, 1000);
        updateClocks();

        // Sovereign Shield: Anti-Inspect / Print protection
        document.onkeydown = function(e) {
            const k = e.keyCode || e.which;
            const f12 = k === 123;
            const devTools = e.ctrlKey && e.shiftKey && (k === 73 || k === 74 || k === 67);
            const viewSource = e.ctrlKey && k === 85;
            if (f12 || devTools || viewSource) {
                document.body.style.filter = "blur(10px)";
                setTimeout(() => { document.body.style.filter = "none"; }, 2000);
                return false;
            }
        };
    </script>
</body>
</html>
